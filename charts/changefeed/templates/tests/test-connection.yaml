apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "changefeed.fullname" . }}-test"
  labels:
    {{- include "changefeed.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: readyz
      image: busybox:1.37
      command: ["wget", "-q", "-O-", "http://{{ include "changefeed.fullname" . }}:{{ .Values.service.port }}/readyz"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        limits:
          memory: 32Mi
