# Default values for changefeed. Every key is documented; see values.schema.json for types.

image:
  repository: ghcr.io/yousafkhamza/changefeed
  # Defaults to the chart appVersion. Pin a digest in production: tag: v0.1.0@sha256:...
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Secrets come from one existing Secret whose keys are the environment
# variable names, for example:
#   kubectl -n changefeed create secret generic changefeed-secrets \
#     --from-literal=CHANGEFEED_DATABASE_URL='postgres://changefeed:…@pg:5432/changefeed?sslmode=require' \
#     --from-literal=CHANGEFEED_SLACK_BOT_TOKEN=xoxb-… \
#     --from-literal=CHANGEFEED_SLACK_SIGNING_SECRET=… \
#     --from-literal=CHANGEFEED_SESSION_KEY="$(openssl rand -base64 48)"
# Supported keys: CHANGEFEED_DATABASE_URL, CHANGEFEED_SLACK_BOT_TOKEN, CHANGEFEED_SLACK_SIGNING_SECRET,
# CHANGEFEED_LAUNCHDARKLY_SECRET, CHANGEFEED_FLAGSMITH_SECRET, CHANGEFEED_OIDC_CLIENT_SECRET, CHANGEFEED_SESSION_KEY.
existingSecret: ""

# Postgres instead of SQLite. Put CHANGEFEED_DATABASE_URL in existingSecret.
# Then changefeed runs several replicas with rolling updates and needs no volume.
postgres:
  enabled: false
  replicaCount: 2

# Without Postgres, changefeed uses SQLite on a ReadWriteOnce volume, so it
# runs one replica with the Recreate strategy. Senders retry during the few
# seconds of a restart.
persistence:
  enabled: true
  size: 2Gi
  storageClass: ""
  accessModes: [ReadWriteOnce]
  # Use an existing PVC instead of creating one.
  existingClaim: ""

# Server configuration, rendered to /etc/changefeed/changefeed.yaml.
# It holds no secrets: tokens are stored as SHA-256 hashes (`changefeed token`).
config:
  listen: ":8080"
  # External URL of the UI; used for Slack links and the SSO redirect.
  publicURL: ""
  storage:
    path: /data/changefeed.db
    retention: 30d
  auth:
    # Let anyone who can reach the service read events. Only enable this
    # behind an SSO proxy (oauth2-proxy, an authenticating ingress).
    anonymousRead: false
    tokens: []
    #  - name: argocd
    #    sha256: "<64 hex chars>"
    #    scopes: [write]
    #    sources: [argocd]
    github:
      enabled: false
      audience: changefeed
      repositories: []   # owner/repo or owner/*
      environments: []
    rateLimit:
      perMinute: 600
    # Sign in to the UI with your identity provider (Okta, Entra ID, Google, Keycloak…).
    # Needs CHANGEFEED_SESSION_KEY (and usually CHANGEFEED_OIDC_CLIENT_SECRET) in existingSecret.
    oidc:
      enabled: false
      issuer: ""          # https://login.example.com
      clientID: ""
      # redirectURL defaults to publicURL + /auth/callback
    # Teams limit what SSO users see. Empty: every signed-in user sees everything.
    teams: []
    #  - name: payments
    #    groups: [payments-oncall]
    #    envs: [prod]
    #    services: [payments-api, checkout-api]
  collectors:
    kubernetes:
      enabled: true
      env: prod
      cluster: ""        # shown in event origin, e.g. prod-eu-1
      namespaces: []     # empty = all namespaces (ClusterRole); listed = Role per namespace
      ignoreNamespaces: [kube-system, kube-public, kube-node-lease]
      watch: [deployments, statefulsets, daemonsets, configmaps]  # add "helm" to record Helm releases
      configMapValues: true
  hooks:
    argocd:
      defaultEnv: prod
    aws:
      defaultEnv: prod
      accounts: {}       # "111122223333": prod
    alertmanager:
      serviceLabels: [service, app_kubernetes_io_name, app, deployment, job]
      envLabels: [env, environment]
      defaultEnv: prod
      window: 60m
    flags:
      services: {}       # flag key -> service, e.g. fast-checkout: checkout-api
      defaultService: flags
      envs: {}           # provider env -> env, e.g. production: prod
  # Dependencies used to rank likely causes.
  services: {}
  #  checkout-api:
  #    dependsOn: [payments-api, cart, orders-db]
  platformServices: []
  # Post likely causes to Slack when Alertmanager opens an incident.
  # Needs CHANGEFEED_SLACK_BOT_TOKEN (and CHANGEFEED_SLACK_SIGNING_SECRET for /changefeed).
  slack:
    enabled: false
    channel: "#incidents"
    minScore: 40
  # Change freeze windows. CI checks them with the action's mode: check-freeze.
  freezes: []
  #  - name: weekend
  #    reason: No prod deploys at the weekend
  #    envs: [prod]
  #    weekly: { from: "fri 16:00", to: "mon 08:00", timezone: Asia/Dubai }
  #  - name: year-end
  #    services: [payments-api]
  #    start: "2026-12-20T00:00:00Z"
  #    end: "2027-01-03T00:00:00Z"

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: changefeed.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Creates a Prometheus Operator ServiceMonitor for /metrics.
serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

# Restricts ingress to the namespaces that send events or read the UI.
networkPolicy:
  enabled: false
  # Extra allowed sources, e.g. the ingress controller namespace.
  from: []
  #  - namespaceSelector:
  #      matchLabels:
  #        kubernetes.io/metadata.name: ingress-nginx

logFormat: json
extraEnv: []
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
